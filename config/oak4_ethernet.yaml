# Standalone ROS preview. Extreme measurements use tools/oak4_extremes.py.
/oak:
  ros__parameters:
    driver:
      i_ip: '192.168.8.238'
      i_enable_ir: false
    pipeline_gen:
      i_pipeline_type: rgbd
      i_nn_type: none
      i_enable_imu: false
      i_enable_rgbd: false
    rgb:
      i_width: 1280
      i_height: 720
      i_fps: 30.0
      i_publish_topic: true
      i_max_q_size: 2
    left:
      i_width: 640
      i_height: 400
      i_fps: 30.0
    right:
      i_width: 640
      i_height: 400
      i_fps: 30.0
    stereo:
      # Native StereoDepth is right-rectified. Also select that socket for
      # CameraInfo and frame naming; the driver's default is the RGB socket.
      i_board_socket_id: 2
      i_depth_preset: DEFAULT
      i_aligned: false
      i_run_align_on_host: false
      i_publish_topic: true
